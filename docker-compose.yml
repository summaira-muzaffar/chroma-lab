services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

  app:
    build: .
    depends_on:
      - chroma
    environment:
      - CHROMA_HOST=chroma
    volumes:
      - .:/app
      - model_cache:/root/.cache/chroma
    command: python app.py

volumes:
  chroma_data:
  model_cache: