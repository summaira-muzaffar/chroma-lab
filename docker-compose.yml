services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data      # keeps your data after restart

  app:
    build: .
    depends_on:
      - chroma
    environment:
      - CHROMA_HOST=chroma     # service name works as hostname
    volumes:
      - .:/app                 # edit code without rebuilding
    command: python app.py

volumes:
  chroma_data: